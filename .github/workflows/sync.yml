name: Sync plugin artifacts

on:
  repository_dispatch:
    types: [skill-released]
  workflow_dispatch:
    inputs:
      skill_version:
        description: Skill version to vendor (blank keeps current)
        required: false

# Exactly one writer. Two releases landing minutes apart queue rather than race.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve target versions
        id: versions
        env:
          # Routed through env instead of interpolated directly into the script:
          # client_payload.* comes from a repository_dispatch call and must never
          # be substituted as raw text into a run: block (command injection).
          SKILL_INPUT: ${{ github.event.client_payload.skill_version || inputs.skill_version }}
        run: |
          CURRENT_SKILL=$(jq -r .skill plugins/pinmeto-locations/components.json)
          SKILL="${SKILL_INPUT:-$CURRENT_SKILL}"

          # Fail closed before any downstream step gets a chance to re-embed this
          # value as script text. A hostile or malformed payload dies here, before
          # MARKETPLACE_SYNC_TOKEN or contents: write are ever in scope.
          SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+$'
          if ! [[ "$SKILL" =~ $SEMVER_RE ]]; then
            echo "::error::skill version '$SKILL' is not a valid semver (expected X.Y.Z)."
            exit 1
          fi

          echo "skill=$SKILL" >> "$GITHUB_OUTPUT"

      - name: Vendor the skill
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}
          SKILL_VERSION: ${{ steps.versions.outputs.skill }}
        run: |
          gh release download "v$SKILL_VERSION" \
            --repo PinMeTo/pinmeto-location-reports-skill \
            --pattern '*.skill' \
            --output /tmp/skill.zip \
            --clobber
          rm -rf plugins/pinmeto-locations/skills/pinmeto-location-reports
          mkdir -p plugins/pinmeto-locations/skills/pinmeto-location-reports
          unzip -q /tmp/skill.zip -d plugins/pinmeto-locations/skills/pinmeto-location-reports

      - name: Reject oversized payloads
        run: |
          SIZE_KB=$(du -sk plugins/pinmeto-locations | cut -f1)
          echo "Plugin payload: ${SIZE_KB} KB"
          if [ "$SIZE_KB" -gt 5120 ]; then
            echo "::error::Plugin payload ${SIZE_KB} KB exceeds the 5 MB budget."
            du -ah plugins/pinmeto-locations | sort -rh | head -20
            exit 1
          fi
          if find plugins/pinmeto-locations -name node_modules -type d | grep -q .; then
            echo "::error::node_modules leaked into the plugin payload."
            exit 1
          fi

      - name: Derive the plugin version
        id: bump
        env:
          SKILL_VERSION: ${{ steps.versions.outputs.skill }}
        run: |
          NEXT=$(node scripts/bump-version.mjs --skill "$SKILL_VERSION")
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Validate the plugin
        run: npx --yes @anthropic-ai/claude-code plugin validate ./plugins/pinmeto-locations --strict

      - name: Commit
        env:
          NEXT_VERSION: ${{ steps.bump.outputs.next }}
          SKILL_VERSION: ${{ steps.versions.outputs.skill }}
        run: |
          if [ "$NEXT_VERSION" = "no change" ]; then
            # Versions didn't move, but the vendor steps may still have downloaded
            # bytes that differ from what's committed (e.g. an asset re-uploaded
            # under an existing tag). Don't silently discard that: warn if the
            # tree is dirty, but still exit 0 - a plain re-run with identical
            # versions downloads identical bytes and must stay a clean no-op.
            if git status --porcelain | grep -q .; then
              echo "::warning::Component versions unchanged but vendored files differ from what's committed. Not committing - investigate before the next release. Changed paths:"
              git status --porcelain
            else
              echo "Component versions unchanged; nothing to commit."
            fi
            exit 0
          fi
          git config user.name "pinmeto-bot"
          git config user.email "dev@pinmeto.com"
          git add -A
          git diff --staged --quiet && echo "No file changes." && exit 0
          git commit -m "chore: sync plugin $NEXT_VERSION (skill $SKILL_VERSION)"
          git push
